<script>

const SUBJECTS = [

const EXAM_BLUEPRINT = {
 title:"Blueprint แนะนำแนวทางการสอบ",

 focus:"7 หมวด",
 items:[
  {title:"ขอบเขตที่ต้องอ่าน",text:"สรุปหัวข้อออกสอบและน้ำหนักแต่ละวิชา"},
  {title:"ลำดับการทำข้อสอบ",text:"แนวทางแบ่งเวลา อ่านโจทย์ และตัดตัวเลือก"},
  {title:"จุดที่ควรทบทวน",text:"รวบรวมประเด็นที่มักพลาดจากผลการทำข้อสอบ"},
  {title:"แผนโค้งสุดท้าย",text:"ตารางอ่าน ทวน และทำ mock ก่อนวันสอบ"}
 ]

const DEMO_QUESTIONS = [
 {questionId:"D001",subject:SUBJECTS[6],difficulty:"ง่าย",question:"ข้อใดเป็นหลักสำคัญของจรรยาบรรณวิชาชีพ",options:["คำนึงถึงประโยชน์และความปลอดภัยของผู้รับบริการ","เปิดเผยข้อมูลผู้รับบริการได้เสมอ","ให้บริการเฉพาะคนที่รู้จัก","หลีกเลี่ยงความรับผิดชอบ"],answerIndex:0,explanation:"หลักจริยธรรมมุ่งคุ้มครองผู้รับบริการและความรับผิดชอบของผู้ประกอบวิชาชีพ."},
 {questionId:"D002",subject:SUBJECTS[1],difficulty:"ง่าย",question:"การป้องกันโรคระดับปฐมภูมิมุ่งเน้นสิ่งใด",options:["ป้องกันก่อนเกิดโรค","รักษาภาวะแทรกซ้อน","ฟื้นฟูหลังพิการ","รักษาในระยะสุดท้าย"],answerIndex:0,explanation:"ปฐมภูมิเน้นการป้องกันก่อนเกิดโรค เช่น การสร้างเสริมสุขภาพและลดปัจจัยเสี่ยง."},
 {questionId:"D003",subject:SUBJECTS[4],difficulty:"ง่าย",question:"ข้อใดเกี่ยวข้องกับอนามัยสิ่งแวดล้อมโดยตรง",options:["คุณภาพน้ำและการจัดการขยะ","การเลือกสีเสื้อ","การทำบัญชีส่วนตัว","การตลาดสินค้า"],answerIndex:0,explanation:"น้ำเสีย ขยะ อากาศ และสิ่งแวดล้อมที่มีผลต่อสุขภาพเป็นประเด็นของอนามัยสิ่งแวดล้อม."},
 {questionId:"D004",subject:SUBJECTS[1],difficulty:"ง่าย",question:"Incidence ใช้สะท้อนสิ่งใด",options:["จำนวนผู้ป่วยรายใหม่ในช่วงเวลาหนึ่ง","จำนวนผู้ป่วยทั้งหมดตลอดชีวิต","จำนวนประชากรทั้งหมด","จำนวนบุคลากรสาธารณสุข"],answerIndex:0,explanation:"Incidence เน้นการเกิดผู้ป่วยรายใหม่ในประชากรช่วงเวลาที่กำหนด."},
 {questionId:"D005",subject:SUBJECTS[0],difficulty:"ง่าย",question:"การมีส่วนร่วมของชุมชนมีประโยชน์อย่างไร",options:["ช่วยให้การแก้ปัญหาสอดคล้องกับบริบทชุมชน","ทำให้ไม่ต้องเก็บข้อมูล","ลดความจำเป็นของการประเมินผล","ให้หน่วยงานตัดสินใจฝ่ายเดียว"],answerIndex:0,explanation:"การมีส่วนร่วมช่วยให้คนในพื้นที่ร่วมวิเคราะห์ วางแผน และสนับสนุนการดำเนินงาน."}
];

let state = {
 page:"dashboard", user:null, questions:[], announcements:[], practice:null,
 mock:null, analysis:null, authMode:"login", loading:false,
 importRows:[], importFileName:"", importSummary:null, importBusy:false
};

function $(id){return document.getElementById(id)}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function answerIndexValue(value){
 if(value===""||value===null||value===undefined)return "";
 const text=String(value).trim();if(!text)return "";
 const map={"ก":0,"ข":1,"ค":2,"ง":3,"จ":4,A:0,B:1,C:2,D:3,E:4};
 const label=text.toUpperCase();if(map[label]!==undefined)return map[label];
 const n=Number(value);return !Number.isNaN(n)&&n>=0?n:"";
}
function hasAnswer(q){return answerIndexValue(q&&q.answerIndex)!==""}
function isCorrectChoice(q,i){const a=answerIndexValue(q&&q.answerIndex);return a!==""&&Number(i)===a}
function scoreKnown(qs,answers){const known=qs.filter(hasAnswer);return {score:known.reduce((n,q)=>n+(isCorrectChoice(q,answers[q.questionId])?1:0),0),total:known.length}}
function optionLabel(i){return ["A","B","C","D","E"][i]||String(Number(i)+1)}
function optionText(q,i){return ((q.options||[])[Number(i)]||"").trim()}
function selectedText(q,i){return i===""||i===undefined||i===null?"ยังไม่ได้เลือก":`${optionLabel(i)}. ${optionText(q,i)}`}
function questionChoiceNotes(q){
 if(Array.isArray(q.choiceExplanations))return q.choiceExplanations;
 if(q.choiceExplanationsJson){try{const parsed=JSON.parse(q.choiceExplanationsJson);return Array.isArray(parsed)?parsed:[]}catch(e){}}

}
function feedbackPanel(q,selected){
 const known=hasAnswer(q), correct=answerIndexValue(q&&q.answerIndex), answered=selected!==undefined&&selected!==null&&selected!=="";
 const picked=answered?Number(selected):"", right=known&&answered&&picked===correct;
 const notes=questionChoiceNotes(q), pickedNote=answered&&notes[picked]?notes[picked]:"", correctNote=known&&notes[correct]?notes[correct]:"";
 const stateClass=!known?"pending":right?"good":"bad";
 const title=!known?"ยังไม่มีเฉลยสำหรับข้อนี้":right?"ตอบถูกแล้ว: เหตุผลที่คำตอบนี้ถูก":"ตอบผิด: เหตุผลที่ควรเปลี่ยนคำตอบ";
 const main=q.explanation||(!known?"ไฟล์ข้อสอบชุดนี้ยังไม่ได้ระบุเฉลย จึงยังตัดสินถูก/ผิดและคำนวณคะแนนของข้อนี้ไม่ได้":"ยังไม่มีคำอธิบายหลักในชีท");
 const resultText=!known?"คำตอบถูกบันทึกไว้เพื่อทบทวน แต่ยังไม่ถูกนำไปคิดคะแนน":right?"คำตอบที่เลือกตรงกับเฉลย ให้จำหลักคิดนี้ไว้ใช้เจอโจทย์รูปแบบใกล้กัน":"คำตอบที่เลือกยังไม่ตรงกับเฉลย ให้ดูคำสำคัญในโจทย์และเหตุผลของตัวเลือกที่ถูก";
 const extra=!known?"เมื่อเติม answerIndex และ explanation ในชีทแล้ว ข้อนี้จะแสดงผลถูก/ผิดพร้อมเหตุผลละเอียดทันที ตอนนี้ให้ใช้เป็นข้อสำหรับฝึกคิดและรอเฉลย":right?(q.correctExplanation||"จุดสำคัญคือคำตอบนี้สอดคล้องกับเงื่อนไขในโจทย์มากที่สุด ควรทบทวนว่าคำสำคัญใดทำให้ตัดตัวเลือกอื่นออกได้"):(q.wrongExplanation||"ให้เปรียบเทียบตัวเลือกที่เลือกกับเฉลยทีละประเด็น แล้วถามตัวเองว่าโจทย์ต้องการนิยาม ขั้นตอน สาเหตุ ผลลัพธ์ หรือข้อยกเว้นใด");
 const learning=q.learningNote||"แนวทบทวน: ขีดเส้นคำสำคัญในโจทย์ จับหมวดความรู้ให้ได้ก่อน แล้วค่อยตัดตัวเลือกที่กว้างเกินไป แคบเกินไป หรือไม่ตรงกับสถานการณ์";
 const noteList=[pickedNote?`<li>ตัวเลือกที่เลือก: ${escapeHtml(pickedNote)}</li>`:"",correctNote&&correctNote!==pickedNote?`<li>ตัวเลือกที่เป็นเฉลย: ${escapeHtml(correctNote)}</li>`:""].join("");
 return `<div class="feedback ${stateClass}"><div class="feedback-title">${escapeHtml(title)}</div><p>${escapeHtml(resultText)}</p><div class="feedback-grid"><div class="feedback-block"><b>คำตอบที่เลือก</b>${escapeHtml(selectedText(q,picked))}</div><div class="feedback-block"><b>เฉลย</b>${known?escapeHtml(selectedText(q,correct)):"ยังไม่มีเฉลยในคลัง"}</div></div><p><b>คำอธิบายหลัก:</b> ${escapeHtml(main)}</p><p><b>อธิบายเพิ่มเติม:</b> ${escapeHtml(extra)}</p>${noteList?`<ul>${noteList}</ul>`:""}<p><b>จำต่อยอด:</b> ${escapeHtml(learning)}</p></div>`;
}
function allSubjects(){const set=new Set(SUBJECTS);state.questions.forEach(q=>q.subject&&set.add(q.subject));state.importRows.forEach(q=>q.subject&&set.add(q.subject));return [...set]}
function countBySubject(rows){return rows.reduce((acc,q)=>{const s=q.subject||"ไม่ระบุหมวดวิชา";acc[s]=(acc[s]||0)+1;return acc},{})}
function parseCsv(text){
 const rows=[];let row=[],cell="",quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i],next=text[i+1];
  if(quoted&&ch==='"'&&next==='"'){cell+='"';i++;continue}
  if(ch==='"'){quoted=!quoted;continue}
  if(!quoted&&ch===","){row.push(cell);cell="";continue}
  if(!quoted&&(ch==="\n"||ch==="\r")){if(ch==="\r"&&next==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";continue}
  cell+=ch;
 }
 row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row);
 const headers=(rows.shift()||[]).map((h,i)=>String(h).replace(/^\uFEFF/,"").trim()||`column${i+1}`);
 return rows.filter(r=>r.some(v=>String(v).trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]!=null?r[i]:""])));
}
function normalizeImportRows(rawRows){
 return rawRows.map((r,idx)=>{
  let options=Array.isArray(r.options)?r.options:null;
  if(!options&&r.optionsJson){try{options=JSON.parse(r.optionsJson)}catch(e){options=null}}
  if(!options)options=["ก","ข","ค","ง"].map(k=>r[k]||r[k+")"]||r[`option${k}`]).filter(Boolean);
  options=(options||[]).map(x=>String(x||"").trim()).filter(Boolean);
  const choiceExplanations=Array.isArray(r.choiceExplanations)?JSON.stringify(r.choiceExplanations):(r.choiceExplanationsJson||r.choiceExplanations||"");
  return {
   questionId:String(r.questionId||r.id||`IMP-${Date.now()}-${idx+1}`).trim(),
   subject:String(r.subject||"ไม่ระบุหมวดวิชา").trim(),
   difficulty:String(r.difficulty||"ไม่ระบุ").trim(),
   question:String(r.question||"").trim(),
   optionsJson:JSON.stringify(options),
   answerIndex:String(r.answerIndex!=null?r.answerIndex:(r.answer!=null?r.answer:"")).trim(),
   explanation:String(r.explanation||"").trim(),
   active:String(r.active!=null?r.active:"TRUE").trim()||"TRUE",
   createdAt:String(r.createdAt||new Date().toISOString()).trim(),
   correctExplanation:String(r.correctExplanation||r.correctFeedback||"").trim(),
   wrongExplanation:String(r.wrongExplanation||r.wrongFeedback||"").trim(),
   choiceExplanationsJson:String(choiceExplanations||"").trim(),
   learningNote:String(r.learningNote||r.note||"").trim()
  };
 }).filter(q=>q.question&&JSON.parse(q.optionsJson).length>=2);
}

async function api(action,data={}){
 if(!isConfigured()) throw new Error("ยังไม่ได้ใส่ GAS_URL");
 const payload=Object.assign({action:action},data||{});
 const r=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
 const j=await r.json(); if(!j.ok) throw new Error(j.message||"เกิดข้อผิดพลาด"); return j;
}

async function handleImportFile(input){
 const file=input.files&&input.files[0];if(!file)return;
 try{
  const text=await file.text();
  const raw=file.name.toLowerCase().endsWith(".json")?JSON.parse(text):parseCsv(text);
  const rows=normalizeImportRows(Array.isArray(raw)?raw:(raw.questions||[]));
  state.importRows=rows;state.importFileName=file.name;state.importSummary=null;
  render();toast(`อ่านไฟล์แล้ว ${rows.length} ข้อ`);
 }catch(e){state.importRows=[];state.importFileName=file.name;state.importSummary={error:"อ่านไฟล์ไม่สำเร็จ: "+e.message};render()}
}

async function importSelectedQuestions(){
 if(!state.user){openLogin();return}
 if(!state.importRows.length){toast("ยังไม่มีไฟล์ข้อสอบ");return}
 state.importBusy=true;state.importSummary={imported:0,skipped:0,invalid:0};render();
 const total={imported:0,skipped:0,invalid:0};
 try{
  for(let i=0;i<state.importRows.length;i+=50){
   const batch=state.importRows.slice(i,i+50);
   const r=await api("importQuestions",{token:state.user.token,questions:batch});
   total.imported+=Number(r.imported||0);total.skipped+=Number(r.skipped||0);total.invalid+=Number(r.invalid||0);
   state.importSummary={imported:total.imported,skipped:total.skipped,invalid:total.invalid,progress:Math.min(i+batch.length,state.importRows.length)};render();
  }
  state.importBusy=false;state.importSummary=total;await bootstrap();toast(`นำเข้าเสร็จ ${total.imported} ข้อ`);
 }catch(e){
  state.importBusy=false;state.importSummary={imported:total.imported,skipped:total.skipped,invalid:total.invalid,error:e.message};render();
 }
}

function startPractice(subjectIndex=null){
 const subjects=allSubjects();
 if(subjectIndex!==null){const subject=subjects[subjectIndex];state.practice={mode:"practice",subject,qs:state.questions.filter(q=>q.subject===subject),index:0,answers:{},revealed:{}}}
 else state.practice=null;
 go("practice");
}
function renderPractice(){
 const subjects=allSubjects();
 if(!state.practice)return `<div class="card"><h3>🧠 แบบฝึกวัดความรู้</h3><p>เลือกหมวดวิชาเพื่อเริ่มฝึก หรือทำครบทุกข้อจากทุกหมวด</p><div class="grid5">${subjects.map((s,i)=>`<div class="subject" onclick="startPractice(${i})"><span class="badge mint">📖 หมวด ${i+1}</span><h3>${escapeHtml(s)}</h3><p>${state.questions.filter(q=>q.subject===s).length||0} ข้อ</p></div>`).join("")}</div><br><button class="btn" onclick="startAllPractice()">ฝึกครบทุกข้อทุกหมวด</button></div>`;
 const p=state.practice;if(!p.qs.length)return '<div class="card empty">หมวดนี้ยังไม่มีข้อสอบ</div>';
 const q=p.qs[p.index], selected=p.answers[q.questionId], revealed=p.revealed[q.questionId];
 return `<div class="card"><div class="row between"><div><span class="badge">${escapeHtml(p.subject||"ทุกหมวด")}</span><p class="muted">ข้อ ${p.index+1} / ${p.qs.length}</p></div><button class="btn secondary" onclick="state.practice=null;render()">เปลี่ยนหมวด</button></div>
 <div class="question"><h3>${escapeHtml(q.question)}</h3>${q.options.map((o,i)=>`<button class="option ${selected===i?"selected ":""}${revealed&&isCorrectChoice(q,i)?"correct ":""}${revealed&&hasAnswer(q)&&selected===i&&!isCorrectChoice(q,i)?"wrong":""}" onclick="practiceAnswer(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join("")}
 ${revealed?feedbackPanel(q,selected):""}
 </div><div class="row between"><button class="btn secondary" onclick="practicePrev()">← ก่อนหน้า</button>${revealed?`<button class="btn" onclick="practiceNext()">${p.index===p.qs.length-1?"จบการฝึก":"ข้อถัดไป →"}</button>`:"<span class='muted'>เลือกคำตอบเพื่อไปต่อ</span>"}</div></div>`;
}
function startAllPractice(){state.practice={mode:"practice",subject:"ทุกหมวด",qs:[...state.questions].sort(()=>Math.random()-.5),index:0,answers:{},revealed:{}};render()}
async function practiceAnswer(i){
 const p=state.practice,q=p.qs[p.index];if(p.revealed[q.questionId])return;p.answers[q.questionId]=i;p.revealed[q.questionId]=true;render();
 if(state.user&&isConfigured())try{await api("saveAnswer",{token:state.user.token,questionId:q.questionId,selectedIndex:i,mode:"practice",examId:"practice-"+Date.now()})}catch(e){console.warn(e)}
}
function practicePrev(){if(state.practice.index>0)state.practice.index--;render()}
async function practiceNext(){
 if(state.practice.index<state.practice.qs.length-1){state.practice.index++;render();return}
 const p=state.practice,result=scoreKnown(p.qs,p.answers);
 if(state.user&&isConfigured()&&result.total)try{await api("savePracticeResult",{token:state.user.token,score:result.score,total:result.total,subject:p.subject})}catch(e){}
 toast(result.total?`ฝึกเสร็จแล้ว ${result.score}/${result.total}`:"ฝึกเสร็จแล้ว ชุดนี้ยังไม่มีเฉลยสำหรับคำนวณคะแนน");state.practice=null;go("dashboard");
}

function renderMock(){
 const subjects=allSubjects();
 if(!state.mock)return `<div class="card hero"><div><h2>⏱️ Mock Exam</h2><p>ครบทุกข้อจาก ${subjects.length} หมวดวิชา • จับเวลา 60 นาที</p><div class="notice">ระบบจะใช้ข้อสอบทั้งหมดในคลังปัจจุบัน ไม่มีการตัดจำนวนข้อออก และยังคงเรียงแยกหมวดให้อ่านง่าย</div><button class="btn" onclick="startMock()">เริ่ม Mock Exam ครบทุกข้อ</button></div><div class="hero-art">⏰</div></div>`;
 const m=state.mock,q=m.qs[m.index],selected=m.answers[q.questionId],total=m.qs.length,answered=Object.prototype.hasOwnProperty.call(m.answers,q.questionId);
 return `<div class="card"><div class="row between"><div><span class="badge">Mock Exam • ${total} ข้อ</span><p class="muted">หมวด ${subjects.indexOf(q.subject)+1}: ${escapeHtml(q.subject)} • ข้อ ${m.index+1}/${total}</p></div><div class="timer" id="mockTimer">${formatTime(m.remaining)}</div></div>
 <div class="progress"><i style="width:${total?((m.index)/total)*100:0}%"></i></div>
 <div class="question"><h3>${escapeHtml(q.question)}</h3>${q.options.map((o,i)=>`<button class="option ${selected===i?"selected ":""}${answered&&isCorrectChoice(q,i)?"correct ":""}${answered&&hasAnswer(q)&&selected===i&&!isCorrectChoice(q,i)?"wrong":""}" onclick="mockSelect(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join("")}${answered?feedbackPanel(q,selected):""}</div>
 <div class="row between"><button class="btn secondary" onclick="mockPrev()">← ก่อนหน้า</button><div class="row">${m.index<total-1?'<button class="btn" onclick="mockNext()">ถัดไป →</button>':'<button class="btn yellow" onclick="submitMock()">ส่งคำตอบ</button>'}</div></div></div>`;
}
function formatTime(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startMock(){
 const qs=[],subjects=allSubjects();
 subjects.forEach(s=>{const pool=state.questions.filter(q=>q.subject===s).sort(()=>Math.random()-.5);qs.push(...pool)});
 const mixed=qs.sort((a,b)=>subjects.indexOf(a.subject)-subjects.indexOf(b.subject));
 if(!mixed.length){toast("ยังไม่มีข้อสอบสำหรับทำ Mock Exam");return}
 state.mock={qs:mixed,index:0,answers:{},remaining:3600,startedAt:Date.now()};
 go("mock");clearInterval(window.mockClock);window.mockClock=setInterval(()=>{if(!state.mock){clearInterval(window.mockClock);return}state.mock.remaining--;if(state.mock.remaining<=0){state.mock.remaining=0;render();submitMock()}else{$("mockTimer")&&($("mockTimer").textContent=formatTime(state.mock.remaining))}},1000);
}
function mockSelect(i){if(!state.mock)return;const q=state.mock.qs[state.mock.index];if(Object.prototype.hasOwnProperty.call(state.mock.answers,q.questionId))return;state.mock.answers[q.questionId]=i;render()}
function mockPrev(){if(state.mock.index>0){state.mock.index--;render()}}
function mockNext(){if(state.mock.index<state.mock.qs.length-1){state.mock.index++;render()}}
async function submitMock(){
 if(!state.mock)return;clearInterval(window.mockClock);
 const m=state.mock, total=m.qs.length, result=scoreKnown(m.qs,m.answers);
 const breakdown={};allSubjects().forEach(s=>{const a=m.qs.filter(q=>q.subject===s&&hasAnswer(q));breakdown[s]={total:a.length,correct:a.reduce((n,q)=>n+(isCorrectChoice(q,m.answers[q.questionId])?1:0),0)}})
 if(state.user&&isConfigured()&&result.total)try{await api("saveMockResult",{token:state.user.token,score:result.score,total:result.total,durationSec:3600-m.remaining,subjectBreakdown:breakdown,answers:m.qs.map(q=>({questionId:q.questionId,selectedIndex:m.answers[q.questionId]!=null?m.answers[q.questionId]:null}))})}catch(e){toast(e.message)}
 state.mock=null;state.analysis=null;await bootstrap();alert(result.total?`ส่งข้อสอบเรียบร้อย\\nคะแนน ${result.score}/${result.total} (${((result.score/result.total)*100).toFixed(1)}%)\\nทำทั้งหมด ${total} ข้อ`:`ส่งข้อสอบเรียบร้อย\\nชุดนี้ยังไม่มีเฉลยสำหรับคำนวณคะแนน\\nทำทั้งหมด ${total} ข้อ`);go("analysis");
}

function renderAnalysis(){
 if(!state.user)return `<div class="card center"><h2>📊 วิเคราะห์จุดอ่อน</h2><p class="muted">เข้าสู่ระบบเพื่อดูผลจากการทำข้อสอบจริงของคุณ</p><button class="btn" onclick="openLogin()">เข้าสู่ระบบ</button></div>`;
 const a=state.analysis;
 if(!a)return `<div class="card center"><h2>📊 วิเคราะห์จุดอ่อน</h2><p>กำลังโหลดข้อมูล...</p></div>`;
 const rows=(a.subjectScores||[]).map(x=>`<tr><td>${escapeHtml(x.subject)}</td><td>${x.correct}/${x.attempts}</td><td><div class="progress"><i style="width:${x.accuracy}%"></i></div></td><td>${x.accuracy.toFixed(1)}%</td></tr>`).join("");
 return `<div class="card"><h3>📊 วิเคราะห์จากผลการทำข้อสอบจริง</h3><p class="muted">คำนวณจากคำตอบรายข้อที่บันทึกใน Google Sheets ไม่ใช่คะแนนประมาณการ</p>
 <table class="table"><thead><tr><th>หมวด</th><th>ถูก/ทำ</th><th>ความแม่นยำ</th><th>%</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="center">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>
 <div class="card"><h3>🎯 จุดที่ควรทบทวน</h3>${(a.weaknesses||[]).map(w=>`<div class="notice"><b>${escapeHtml(w.subject)}</b> — ความแม่นยำ ${Number(w.accuracy).toFixed(1)}%<br>${escapeHtml(w.recommendation||"ควรฝึกเพิ่มในหมวดนี้")}</div>`).join("")||'<div class="empty">ทำข้อสอบเพิ่มเติมเพื่อให้ระบบวิเคราะห์จุดอ่อนได้แม่นยำขึ้น</div>'}</div>`;
}

function renderNews(){
 return `<div class="card"><h3>📢 ประกาศและกำหนดการ</h3>${state.announcements.length?state.announcements.map(a=>`<div class="notice"><b>${escapeHtml(a.title)}</b><br>${escapeHtml(a.message||"")}<br><small class="muted">${escapeHtml(a.date||"")}</small></div>`).join(""):'<div class="empty">ยังไม่มีประกาศ</div>'}</div>`;
}
function renderProfile(){
 if(!state.user)return `<div class="card center"><h2>👤 โปรไฟล์</h2><p>กรุณาเข้าสู่ระบบเพื่อดูโปรไฟล์และประวัติ</p><button class="btn" onclick="openLogin()">เข้าสู่ระบบ</button></div>`;
 return `<div class="card"><h3>👤 โปรไฟล์สมาชิก</h3><p><b>ชื่อ:</b> ${escapeHtml(state.user.name)}</p><p><b>อีเมล:</b> ${escapeHtml(state.user.email)}</p><p><b>สมาชิกตั้งแต่:</b> ${escapeHtml(state.user.createdAt||"-")}</p><div class="row"><button class="btn mint" onclick="go('import')">⬆️ นำเข้าข้อสอบ</button><button class="btn danger" onclick="logout()">ออกจากระบบ</button></div></div>`;
}
async function logout(){
 try{if(state.user&&isConfigured())await api("logout",{token:state.user.token})}catch(e){}
 state.user=null;saveLocal();updateUser();toast("ออกจากระบบแล้ว");go("dashboard");
}
loadLocal();updateUser();bootstrap();
</script>
</body>
</html>
